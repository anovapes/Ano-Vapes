<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12K Vapes – Ano Vapes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="vapes-page">
        <header class="page-header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>12K <span>Vapes</span></h1>
        </header>

        <main class="vapes-grid">
            <div class="vape-card" style="background: linear-gradient(135deg, #6b8e23, #9acd32, #ffd700, #ff8c00);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Kiwi Passion Fruit Guava</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card" style="background: linear-gradient(135deg, #ff6b9d, #ffa07a, #ffe4b5);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Pink Lemonade</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card" style="background: linear-gradient(135deg, #ffb347, #ffdab9, #e0f7fa);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Peach Ice</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card" style="background: linear-gradient(135deg, #8b008b, #dc143c, #ff4500, #4169e1);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Mixed Berries</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card" style="background: linear-gradient(135deg, #0d47a1, #1e90ff, #87ceeb);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Dr Blue</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card" style="background: linear-gradient(135deg, #8b0000, #ff4444, #ffffff);">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Cherry Ice</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>

            <div class="vape-card strawberry-kiwi">
                <div class="vape-overlay"></div>
                <div class="vape-content">
                    <h2>Strawberry Kiwi</h2>
                    <span class="vape-tag">12K</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
