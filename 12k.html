<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12K Vapes – Ano Vapes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="vapes-page">
    <header class="page-header">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Zurück
        </a>
        <h1>12K <span>Vapes</span></h1>
        <div class="hero-lines">
            <span class="line red"></span>
            <span class="line blue"></span>
        </div>
    </header>

    <main class="vapes-grid">
        <!-- Kiwi Passion Fruit Guava -->
        <div class="vape-card" style="background: linear-gradient(135deg, #8bc34a 0%, #cddc39 30%, #ffeb3b 60%, #ff9800 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Kiwi Passion Fruit Guava</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Pink Lemonade -->
        <div class="vape-card" style="background: linear-gradient(135deg, #ff6b9d 0%, #ff9a9e 40%, #ffe066 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Pink Lemonade</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Peach Ice -->
        <div class="vape-card" style="background: linear-gradient(135deg, #ffb347 0%, #ffcc80 40%, #fff5e6 80%, #b3e5fc 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Peach Ice</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Mixed Berries -->
        <div class="vape-card" style="background: linear-gradient(135deg, #7b1fa2 0%, #e91e63 40%, #ff5722 70%, #3f51b5 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Mixed Berries</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Dr Blue -->
        <div class="vape-card" style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 40%, #42a5f5 70%, #90caf9 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Dr Blue</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Cherry Ice -->
        <div class="vape-card" style="background: linear-gradient(135deg, #c62828 0%, #e53935 40%, #ff8a80 60%, #ffffff 100%);">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Cherry Ice</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>

        <!-- Strawberry Kiwi -->
        <div class="vape-card strawberry-kiwi">
            <div class="vape-overlay"></div>
            <div class="vape-content">
                <h2>Strawberry Kiwi</h2>
                <span class="vape-tag">12K</span>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Ano Vapes</p>
    </footer>
</body>
</html>
